name: "DCO"
on:
  # Deliberately no `branches:` filter - PRs in this repo are routinely stacked on another open
  # PR's branch rather than main/develop directly. A branches filter here meant this never ran on
  # #17/#18/#20 at all (see Test's own history and cheqd/agent-toolkit#23). DCO specifically needs
  # the pull_request event's base/head SHAs to diff the commit range, so unlike Lint/Build it
  # can't move into the push-triggered dispatch.yml pipeline - it stays pull_request-triggered,
  # just without the filter that broke it.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  check-sign-off:
    name: "Check sign-off"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify every commit carries a Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            if git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              continue
            fi
            echo "::error::Missing Signed-off-by: $sha $(git log -1 --format=%s "$sha")"
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits carry a DCO sign-off."
