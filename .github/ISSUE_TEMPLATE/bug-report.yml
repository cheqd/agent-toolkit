name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us more about this potential bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce this bug?
      description: "How do you trigger this bug? Please walk us through it step-by-step."
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Relevant versions, for example Node.js, @a2a-js/sdk, or the specification revision."
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy-paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/cheqd/.github/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
