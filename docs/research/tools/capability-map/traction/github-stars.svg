</style><rect width="960" height="1012" fill="var(--surface)"/><text class="t" x="40" y="30">GitHub stars on each protocol's main repository</text><text class="sub" x="40" y="50">Log scale, 16 Oct 2026. Stars measure attention, not use. Star history over time was not available from the GitHub API here.</text><circle cx="44" cy="76" r="5" style="fill:var(--s1);stroke:var(--surface);stroke-width:2"/><text class="val" x="54" y="80">Commits in the last 13 weeks</text><circle cx="260" cy="76" r="5" style="fill:var(--surface);stroke:var(--s1);stroke-width:2"/><text class="val" x="270" y="80">No commits in the last 13 weeks</text><line class="grid" x1="150.0" x2="150.0" y1="94" y2="576"/><text class="ax" x="150.0" y="592" text-anchor="middle">10</text><line class="grid" x1="290.0" x2="290.0" y1="94" y2="576"/><text class="ax" x="290.0" y="592" text-anchor="middle">100</text><line class="grid" x1="430.0" x2="430.0" y1="94" y2="576"/><text class="ax" x="430.0" y="592" text-anchor="middle">1K</text><line class="grid" x1="570.0" x2="570.0" y1="94" y2="576"/><text class="ax" x="570.0" y="592" text-anchor="middle">10K</text><line class="grid" x1="710.0" x2="710.0" y1="94" y2="576"/><text class="ax" x="710.0" y="592" text-anchor="middle">100K</text><text class="lab" x="138" y="118.0" text-anchor="end">A2A</text><circle cx="628.5" cy="114.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>A2A (a2aproject/A2A): 26,176 stars, 2,675 forks, created 2025-03-25, last push 2026-10-16</title></circle><text class="val" x="640.5" y="118.0">26,176  ·  created Mar 2025</text><text class="lab" x="138" y="146.0" text-anchor="end">MCP</text><circle cx="566.6" cy="142.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>MCP (modelcontextprotocol/modelcontextprotocol): 9,458 stars, 1,870 forks, created 2024-09-24, last push 2026-10-15</title></circle><text class="val" x="578.6" y="146.0">9,458  ·  created Sep 2024</text><text class="lab" x="138" y="174.0" text-anchor="end">x402</text><circle cx="545.9" cy="170.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>x402 (x402-foundation/x402): 6,723 stars, 2,192 forks, created 2025-02-21, last push 2026-10-15</title></circle><text class="val" x="557.9" y="174.0">6,723  ·  created Feb 2025</text><text class="lab" x="138" y="202.0" text-anchor="end">UCP</text><circle cx="504.9" cy="198.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>UCP (Universal-Commerce-Protocol/ucp): 3,429 stars, 479 forks, created 2025-12-31, last push 2026-10-16</title></circle><text class="val" x="516.9" y="202.0">3,429  ·  created Dec 2025</text><text class="lab" x="138" y="230.0" text-anchor="end">AP2</text><circle cx="501.3" cy="226.0" r="6" style="fill:var(--surface);stroke:var(--s1);stroke-width:2"><title>AP2 (google-agentic-commerce/AP2): 3,230 stars, 512 forks, created 2025-05-30, last push 2026-06-17</title></circle><text class="val" x="513.3" y="230.0">3,230  ·  created May 2025</text><text class="lab" x="138" y="258.0" text-anchor="end">ACP</text><circle cx="457.6" cy="254.0" r="6" style="fill:var(--surface);stroke:var(--s1);stroke-width:2"><title>ACP (agentic-commerce-protocol/agentic-commerce-protocol): 1,574 stars, 255 forks, created 2025-09-29, last push 2026-07-18</title></circle><text class="val" x="469.6" y="258.0">1,574  ·  created Sep 2025</text><text class="lab" x="138" y="286.0" text-anchor="end">L402*</text><circle cx="350.6" cy="282.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>L402 (lightninglabs/aperture): 271 stars, 82 forks, created 2019-01-30, last push 2026-10-15</title></circle><text class="val" x="362.6" y="286.0">271  ·  created Jan 2019</text><text class="lab" x="138" y="314.0" text-anchor="end">TAP</text><circle cx="336.0" cy="310.0" r="6" style="fill:var(--surface);stroke:var(--s1);stroke-width:2"><title>TAP (visa/trusted-agent-protocol): 213 stars, 45 forks, created 2025-10-10, last push 2025-10-28</title></circle><text class="val" x="348.0" y="314.0">213  ·  created Oct 2025</text><text class="lab" x="138" y="342.0" text-anchor="end">MPP*</text><circle cx="327.7" cy="338.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>MPP (wevm/mppx): 186 stars, 71 forks, created 2026-01-21, last push 2026-10-16</title></circle><text class="val" x="339.7" y="342.0">186  ·  created Jan 2026</text><text class="lab" x="138" y="370.0" text-anchor="end">Web Bot Auth*</text><circle cx="322.3" cy="366.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>Web Bot Auth (cloudflare/web-bot-auth): 170 stars, 43 forks, created 2025-04-14, last push 2026-10-12</title></circle><text class="val" x="334.3" y="370.0">170  ·  created Apr 2025</text><text class="lab" x="138" y="398.0" text-anchor="end">ANS*</text><circle cx="238.7" cy="394.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>ANS (agentnameservice/ans): 43 stars, 6 forks, created 2026-05-06, last push 2026-10-15</title></circle><text class="val" x="250.7" y="398.0">43  ·  created May 2026</text><text class="lab" x="138" y="426.0" text-anchor="end">x401</text><circle cx="237.3" cy="422.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>x401 (proof/x401): 42 stars, 5 forks, created 2026-05-07, last push 2026-10-03</title></circle><text class="val" x="249.3" y="426.0">42  ·  created May 2026</text><text class="lab" x="138" y="454.0" text-anchor="end">KYA-OS</text><circle cx="218.8" cy="450.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>KYA-OS (decentralized-identity/kya-os-mcp): 31 stars, 13 forks, created 2026-03-10, last push 2026-10-14</title></circle><text class="val" x="230.8" y="454.0">31  ·  created Mar 2026</text><text class="lab" x="138" y="482.0" text-anchor="end">PAP</text><circle cx="192.1" cy="478.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>PAP (personal-agent-protocol/personal-agent-protocol): 20 stars, 1 forks, created 2026-10-14, last push 2026-10-15</title></circle><text class="val" x="204.1" y="482.0">20  ·  created Oct 2026</text><text class="lab" x="138" y="510.0" text-anchor="end">KYAPay</text><circle cx="166.0" cy="506.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>KYAPay (skyfire-xyz/kyapay): 13 stars, 0 forks, created 2025-06-25, last push 2026-09-11</title></circle><text class="val" x="178.0" y="510.0">13  ·  created Jun 2025</text><text class="lab" x="138" y="538.0" text-anchor="end">cheqd*</text><circle cx="161.1" cy="534.0" r="6" style="fill:var(--s1);stroke:var(--s1);stroke-width:2"><title>cheqd (cheqd/did-resolver): 12 stars, 7 forks, created 2022-03-25, last push 2026-09-03</title></circle><text class="val" x="173.1" y="538.0">12  ·  created Mar 2022</text><text class="lab" x="138" y="566.0" text-anchor="end">Baselayer KYA</text><rect class="nd" x="158" y="552.0" width="544" height="20" rx="4"/><text class="ndt" x="170" y="566.0">No data: closed commercial product, no public repository</text><text class="ax" x="40" y="616">* Charted repository is an SDK or implementation, not the specification:</text><text class="ax" x="40" y="630">   MPP: wevm/mppx, the TypeScript SDK. The specification repository, tempoxyz/mpp-specs, is not charted.</text><text class="ax" x="40" y="644">   L402: lightninglabs/aperture, a reference implementation. The specification repository, lightninglabs/L402, is not charted.</text><text class="ax" x="40" y="658">   ANS: agentnameservice/ans, a Go reference implementation whose operator is unconfirmed. The IETF draft has no repository.</text><text class="ax" x="40" y="672">   Web Bot Auth: cloudflare/web-bot-auth, Cloudflare&#x27;s implementation. The IETF draft is not charted.</text><text class="ax" x="40" y="686">   cheqd: cheqd/did-resolver, one cheqd repository. The cheqd network and other repositories are not charted.</text><rect class="nd" x="40" y="716" width="880" height="272" rx="6"/><text class="lab" x="52" y="736" style="font-weight:700">Not covered by this chart</text><text class="val" x="52" y="760" style="font-weight:700;fill:var(--ink)">Protocols with no data</text><text class="ndt" x="52" y="775" style="font-style:normal">Baselayer KYA: closed commercial product, no public repository.</text><text class="val" x="52" y="799" style="font-weight:700;fill:var(--ink)">Other repositories, with stars</text><text class="ndt" x="52" y="814" style="font-style:normal">One repository is charted per protocol. The MCP Python and TypeScript SDKs hold more stars than the specification repository charted.</text><text class="ndt" x="52" y="828" style="font-style:normal">A2A: a2a-python 2,203, a2a-samples 1,799, a2a-js 643, a2a-java 505, a2a-inspector 501, a2a-go 487, a2a-dotnet 267, a2a-rs 94</text><text class="ndt" x="52" y="842" style="font-style:normal">MCP: python-sdk 24,593, typescript-sdk 13,590, go-sdk 5,231, csharp-sdk 4,587, rust-sdk 4,018, java-sdk 3,739</text><text class="ndt" x="52" y="856" style="font-style:normal">x402: a2a-x402 564, wg-identity 4</text><text class="ndt" x="52" y="870" style="font-style:normal">UCP: samples 240, python-sdk 89, js-sdk 48, conformance 29, ucp-schema 11</text><text class="ndt" x="52" y="884" style="font-style:normal">MPP: mpp-specs 95</text><text class="ndt" x="52" y="898" style="font-style:normal">L402: L402 91, lightning-agent-tools 60</text><text class="ndt" x="52" y="912" style="font-style:normal">ANS: ans-registry 33</text><text class="ndt" x="52" y="926" style="font-style:normal">PAP: personal-agent-protocol 3, pi-poppy 1, poppyseed 0</text><text class="ndt" x="52" y="940" style="font-style:normal">x401: x401-node 3, x401-ruby 0</text><text class="ndt" x="52" y="954" style="font-style:normal">KYAPay: kyapay_a2a 3</text><text class="ndt" x="52" y="968" style="font-style:normal">cheqd: sdk 8, did-provider-cheqd 8</text></svg>