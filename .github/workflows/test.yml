name: "Test"
on:
  # Deliberately no `branches:` filter here, unlike Lint/DCO - this repo's PRs are routinely
  # stacked on top of each other (base branch is another open PR's branch, not main/develop), so
  # a branches filter would mean this never runs on any PR except whichever one currently targets
  # main/develop directly. Running on every PR regardless of base is the point.
  pull_request: {}
  push:
    branches:
      - develop
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Build, unit tests, smoke tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (clean, not incremental)
        run: |
          find . -name "*.tsbuildinfo" -not -path "*/node_modules/*" -delete
          npm run build

      - name: Unit tests - @cheqd/agent-identity
        run: node --test packages/core/test/*.test.mjs

      - name: Smoke tests - @cheqd/agent-identity-a2a
        working-directory: packages/a2a
        run: |
          node smoke-test.mjs
          node smoke-test-agent-card.mjs
