[tool.poetry]
name = "cheqd-agent-identity-a2a"
version = "0.0.0"
description = "DRAFT — A2A trust binding: covered-request canonicalisation and the trust extension. Python port - partial, see docs/design-decisions.md D12."
authors = []
license = "Apache-2.0"
packages = [{ include = "cheqd_agent_identity_a2a", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
cheqd-agent-identity = { path = "../core", develop = true }

[tool.poetry.group.dev.dependencies]
ruff = "0.12.8"
pytest = "^8.3.5"
pytest-asyncio = "^1.1.0"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "C", "D"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D204",
    "D205",
    "D213",
    "D215",
    "D400",
    "D401",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    "D202",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "D", "E501"]

[tool.pytest.ini_options]
testpaths = "tests"
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.1"]
build-backend = "poetry.core.masonry.api"
