<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1012" width="960" height="1012" role="img" aria-labelledby="t d"><title id="t">GitHub stars on each protocol main repository</title><desc id="d">Dot plot on a log scale. A2A 26,176; MCP 9,458; x402 6,723; UCP 3,429; AP2 3,230; ACP 1,574; L402 271; TAP 213; MPP 186; Web Bot Auth 170; ANS 43; x401 42; KYA-OS 31; PAP 20; KYAPay 13; cheqd 12; Baselayer KYA has no data (closed product)</desc><style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--ink3:#76756f;--grid:#e6e5e1;--axis:#b9b8b2;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;}
