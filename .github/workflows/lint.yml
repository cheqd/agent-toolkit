name: "Lint"
on:
  workflow_call:
defaults:
  run:
    shell: bash

jobs:
  md-link-check:
    name: "Broken Markdown links"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run Markdown link check
        uses: tcort/github-action-markdown-link-check@v1
        with:
          config-file: '.github/linters/mlc_config.json'
          use-quiet-mode: 'yes'

  super-lint:
    name: "Super Linter"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Super Linter
        uses: super-linter/super-linter/slim@v8
        env:
          IGNORE_GITIGNORED_FILES: true
          DEFAULT_BRANCH: main
          LINTER_RULES_PATH: '.github/linters'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: WARN
          VALIDATE_ALL_CODEBASE: true
          MULTI_STATUS: true

          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JSONC: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          # JS/TS linting is NOT done here - Super Linter's bundled ESLint config doesn't see
          # this repo's eslint.config.mjs, doesn't run `npm ci`, and knows nothing of the
          # workspace's npm-resolved imports or its actual Node 20 target - it flagged every
          # workspace import as unresolvable and every modern Node API (fetch, structuredClone,
          # error `cause`) as unsupported against a fallback baseline of Node 16. Linted for real,
          # with dependencies actually installed, as an explicit `npm run lint` step in build.yml.
